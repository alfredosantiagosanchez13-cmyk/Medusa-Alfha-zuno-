name: Build and Export Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare build environment
        run: |
          echo "Setting up environment files and keystore..."
          # Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore exists
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Ensure gradlew is executable
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize APK deliverables
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/ .build-outputs/ -name "*.apk" 2>/dev/null -exec cp {} build-artifacts/ZunoAiPulidor-56300-debug.apk \; || true
          
          # If output is in exports folder, copy as fallback
          if [ ! -f build-artifacts/ZunoAiPulidor-56300-debug.apk ] && [ -f exports/ZunoAiPulidor-56300-debug.apk ]; then
            cp exports/ZunoAiPulidor-56300-debug.apk build-artifacts/
          fi
          
          ls -la build-artifacts/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZunoAiPulidor-56300-debug-apk
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
